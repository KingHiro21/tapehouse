<script id="th-app">
'use strict';
/* =====================================================================
   Tapehouse — browser music studio
   Part 1: utilities, storage, plugin format, audio engine, file codecs
   ===================================================================== */

/* ---------- where we run ----------
   Inside claude.ai the page gets window.claude (downloads, Ask Claude) but no microphone.
   Saved as its own file and opened in Chrome or Edge, it gets the mic and normal downloads. */
const APP_VERSION = '2.2';
const STANDALONE = !(window.claude && typeof window.claude.use === 'function');
// Snapshot of the page as written, taken before anything renders, so the claude.ai view can hand out a standalone copy.
const PAGE_PARTS = (() => {
  try {
    const st = document.getElementById('th-style'), sc = document.getElementById('th-app'), body = document.body.cloneNode(true);
    body.querySelectorAll('script, style, title, meta, link').forEach(x => x.remove());
    return st && sc ? { css: st.textContent, markup: body.innerHTML, js: sc.textContent } : null;
  } catch (e) { return null; }
})();

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const dbToGain = db => Math.pow(10, db / 20);
const midiFreq = n => 440 * Math.pow(2, (n - 69) / 12);
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = n => NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
const isBlack = n => [1, 3, 6, 8, 10].includes(((n % 12) + 12) % 12);
const COLORS = ['#e2b36b', '#c7a68a', '#a9a397', '#9db497', '#8ea5b2', '#a89bb6', '#c39589', '#cdbd8c'];
const OLD_COLORS = ['#f2a640', '#62c6d6', '#ef7d5e', '#a493f0', '#7dd892', '#e872ad', '#d8c95c', '#5f9ff0'];
const remapColor = c => { const i = OLD_COLORS.indexOf(String(c).toLowerCase()); return i >= 0 ? COLORS[i] : c; };
const WAVES = ['sine', 'square', 'sawtooth', 'triangle'];
const FILTER_TYPES = ['lowpass', 'highpass', 'bandpass', 'notch', 'lowshelf', 'highshelf', 'peaking', 'allpass'];
const AUDIO_EXT = ['wav', 'wave', 'mp3', 'ogg', 'oga', 'flac', 'm4a', 'aac', 'opus', 'webm', 'aif', 'aiff', 'caf', 'mp4'];
const extOf = n => (String(n).split('/').pop().match(/\.([^.]+)$/) || [, ''])[1].toLowerCase();
const fileName = n => String(n).split('/').pop();
const baseName = n => fileName(n).replace(/\.[^.]+$/, '') || 'Untitled';
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 32) || 'plugin';
const safeFile = s => String(s).replace(/[\\/:*?"<>|]+/g, '-').trim().slice(0, 80) || 'Tapehouse';
const fmtBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
const fmtDur = s => !Number.isFinite(s) ? '–' : s < 10 ? s.toFixed(2) + 's' : s < 60 ? s.toFixed(1) + 's' : Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const fmtDb = g => g <= 0.0001 ? '−∞' : ((20 * Math.log10(g)) >= 0 ? '+' : '') + (20 * Math.log10(g)).toFixed(1);
const fmtPan = p => Math.abs(p) < 0.02 ? 'C' : (p < 0 ? 'L' : 'R') + Math.round(Math.abs(p) * 100);
const utf8 = s => new TextEncoder().encode(s);
const disc = (...ns) => ns.forEach(n => { try { n && n.disconnect(); } catch (e) { /* already disconnected */ } });
function debounce(fn, ms) { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.flush = () => { clearTimeout(t); fn(); }; return d; }

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  let value;
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (['checked', 'disabled', 'selected', 'hidden', 'draggable', 'tabIndex', 'multiple', 'readOnly', 'spellcheck'].includes(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) { if (k == null || k === false) continue; e.append(k instanceof Node ? k : String(k)); }
  if (value !== undefined) e.value = value;
  return e;
}

/* ---------- storage: IndexedDB with in-memory fallback ---------- */
const Store = (() => {
  const STORES = ['samples', 'sampleData', 'plugins', 'projects', 'meta'];
  const mem = Object.fromEntries(STORES.map(s => [s, new Map()]));
  let dbp = null, durable = true;
  const keyOf = (store, v) => store === 'meta' ? v.key : v.id;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(resolve => {
      let done = false;
      const res = v => { if (!done) { done = true; resolve(v); } };
      setTimeout(() => { if (!done) { durable = false; res(null); } }, 3000);
      try {
        const r = indexedDB.open('tapehouse', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'meta' ? 'key' : 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => { durable = false; res(null); };
        r.onblocked = () => { durable = false; res(null); };
      } catch (e) { durable = false; res(null); }
    });
    return dbp;
  }
  function req(d, store, mode, fn) {
    return new Promise((res, rej) => {
      let out;
      const t = d.transaction(store, mode);
      const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error || new Error('Storage error'));
      t.onabort = () => rej(t.error || new Error('Storage was full or blocked'));
    });
  }
  return {
    get durable() { return durable; },
    open,
    async get(store, key) { const d = await open(); return d ? req(d, store, 'readonly', s => s.get(key)) : mem[store].get(key); },
    async put(store, val) { const d = await open(); if (!d) { mem[store].set(keyOf(store, val), val); return; } return req(d, store, 'readwrite', s => s.put(val)); },
    async del(store, key) { const d = await open(); if (!d) { mem[store].delete(key); return; } return req(d, store, 'readwrite', s => s.delete(key)); },
    async all(store) { const d = await open(); return d ? req(d, store, 'readonly', s => s.getAll()) : [...mem[store].values()]; },
  };
})();

/* ---------- plugin format ---------- */
const REF = /^\$([A-Za-z_]\w*)(?:\*(-?\d*\.?\d+))?$/;
function resolveT(x, vals) {
  if (typeof x === 'string' && x[0] === '$') {
    const m = x.match(REF); if (!m) return x;
    const v = vals[m[1]];
    return (m[2] && typeof v === 'number') ? v * parseFloat(m[2]) : v;
  }
  if (Array.isArray(x)) return x.map(y => resolveT(y, vals));
  if (x && typeof x === 'object') { const o = {}; for (const k in x) o[k] = resolveT(x[k], vals); return o; }
  return x;
}
function paramDefaults(m) { const o = {}; for (const p of m.params || []) o[p.id] = p.default; return o; }
function effectiveParams(m, over) {
  const o = paramDefaults(m);
  if (over) for (const p of m.params || []) if (over[p.id] !== undefined) o[p.id] = over[p.id];
  return o;
}

function validatePlugin(o) {
  const fail = msg => { throw new Error(msg); };
  if (!o || typeof o !== 'object' || Array.isArray(o)) fail('Plugin manifest must be a JSON object.');
  if (o.format && o.format !== 'tapehouse-plugin') fail('"format" must be "tapehouse-plugin".');
  if (!['instrument', 'effect'].includes(o.type)) fail('"type" must be "instrument" or "effect".');
  if (typeof o.name !== 'string' || !o.name.trim()) fail('"name" is required.');
  const params = Array.isArray(o.params) ? o.params.map(p => ({ ...p })) : [];
  if (params.length > 16) fail('A plugin can have at most 16 params.');
  const ids = new Set();
  for (const p of params) {
    if (!p || typeof p.id !== 'string' || !/^[A-Za-z_]\w*$/.test(p.id)) fail(`Param id "${p && p.id}" must use letters, digits or _ and not start with a digit.`);
    if (ids.has(p.id)) fail(`Param "${p.id}" is defined twice.`);
    ids.add(p.id);
    p.label = String(p.label || p.id).slice(0, 18);
    if (Array.isArray(p.options)) {
      if (!p.options.length) fail(`Param "${p.id}" has an empty options list.`);
      p.options = p.options.map(x => (x && typeof x === 'object') ? { label: String(x.label ?? x.value), value: x.value } : { label: String(x), value: x });
      if (!p.options.some(x => x.value === p.default)) p.default = p.options[0].value;
    } else {
      if (![p.min, p.max, p.default].every(Number.isFinite) || p.min >= p.max) fail(`Param "${p.id}" needs numeric "min" < "max" and a "default".`);
      if (p.curve === 'log' && p.min <= 0) fail(`Param "${p.id}": a log curve needs min > 0.`);
      p.default = clamp(p.default, p.min, p.max);
    }
  }
  const checkRefs = (x, where) => {
    if (typeof x === 'string' && x[0] === '$') { const m = x.match(REF); if (!m || !ids.has(m[1])) fail(`${where} uses "${x}" but no param has that id.`); }
    else if (x && typeof x === 'object') for (const k in x) checkRefs(x[k], where);
  };
  if (o.type === 'instrument') {
    const v = o.voice;
    if (!v || !Array.isArray(v.oscillators) || !v.oscillators.length || v.oscillators.length > 8) fail('An instrument needs "voice.oscillators" with 1 to 8 entries.');
    for (const osc of v.oscillators) if (osc.wave && !WAVES.includes(osc.wave)) fail(`Unknown wave "${osc.wave}". Use ${WAVES.join(', ')}.`);
    if (v.lfo && v.lfo.target && !['pitch', 'filter', 'amp'].includes(v.lfo.target)) fail('"lfo.target" must be pitch, filter or amp.');
    checkRefs(v, 'voice');
  } else if (!o.script) {
    if (!Array.isArray(o.graph) || !o.graph.length || o.graph.length > 12) fail('An effect needs a "graph" with 1 to 12 nodes.');
    for (const n of o.graph) if (!n || !PRIMS[n.node]) fail(`Unknown node "${n && n.node}". Use one of: ${Object.keys(PRIMS).join(', ')}.`);
    checkRefs(o.graph, 'graph');
  }
  return {
    format: 'tapehouse-plugin', id: o.id, type: o.type, name: o.name.trim().slice(0, 48),
    author: o.author ? String(o.author).slice(0, 48) : '', description: o.description ? String(o.description).slice(0, 220) : '',
    params, voice: o.voice, graph: o.graph, script: !!o.script, processor: o.processor,
  };
}
function parseScriptPlugin(src) {
  const m = src.match(/^\s*\/\/\s*@tapehouse\s+(\{.*\})\s*$/m);
  if (!m) throw new Error('Script plugins start with a header line: // @tapehouse {"type":"effect", ...}');
  let man;
  try { man = JSON.parse(m[1]); } catch (e) { throw new Error('The @tapehouse header is not valid JSON.'); }
  if (man.type !== 'effect') throw new Error('Script plugins can be effects only.');
  if (typeof man.processor !== 'string' || !/^[\w-]+$/.test(man.processor)) throw new Error('The header needs "processor": the name you pass to registerProcessor().');
  if (!src.includes('registerProcessor')) throw new Error('The script never calls registerProcessor().');
  man.script = true;
  return validatePlugin(man);
}

const plugins = new Map(); // id -> {id, manifest, source, builtin}
const getPlugin = id => plugins.get(id);

const BUILTIN_PLUGINS = [
  { id: 'th.tape-keys', type: 'instrument', name: 'Tape Keys', author: 'Tapehouse', description: 'Soft electric-piano tone with a bell overtone.',
    params: [
      { id: 'tone', label: 'Tone', min: 300, max: 9000, default: 2600, curve: 'log', unit: 'Hz' },
      { id: 'decay', label: 'Decay', min: 0.1, max: 3, default: 0.9, unit: 's' },
      { id: 'release', label: 'Release', min: 0.02, max: 2, default: 0.35, unit: 's' },
      { id: 'bell', label: 'Bell', min: 0, max: 0.6, default: 0.22 }],

      filter: { type: 'lowpass', cutoff: '$tone', q: 0.6, envAmount: 1800, envelope: { attack: 0.003, decay: 0.35, sustain: 0, release: 0.3 } } } },

    params: [

      { id: 'detune', label: 'Detune', min: 0, max: 30, default: 11, unit: 'ct' },
      { id: 'attack', label: 'Attack', min: 0.01, max: 3, default: 0.7, unit: 's' },
      { id: 'release', label: 'Release', min: 0.1, max: 4, default: 1.6, unit: 's' },
      { id: 'motion', label: 'Motion', min: 0, max: 1500, default: 450, unit: 'Hz' }],
    voice: { gain: 0.22, oscillators: [{ wave: 'sawtooth', detune: '$detune', gain: 0.5 }, { wave: 'sawtooth', detune: '$detune*-1', gain: 0.5 }, { wave: 'square', octave: -1, gain: 0.18 }],
      envelope: { attack: '$attack', decay: 0.8, sustain: 0.85, release: '$release' },
      filter: { type: 'lowpass', cutoff: '$cutoff', q: 1.1, envAmount: 500, envelope: { attack: '$attack', decay: 1, sustain: 0.4, release: '$release' } },
      lfo: { target: 'filter', rate: 0.22, depth: '$motion' } } },

    params: [
      { id: 'cutoff', label: 'Cutoff', min: 80, max: 4000, default: 420, curve: 'log', unit: 'Hz' },
      { id: 'resonance', label: 'Reso', min: 0.5, max: 22, default: 11 },
      { id: 'envmod', label: 'Env Mod', min: 0, max: 5000, default: 2400, unit: 'Hz' },
      { id: 'decay', label: 'Decay', min: 0.05, max: 1, default: 0.22, unit: 's' }],

      envelope: { attack: 0.002, decay: 0.3, sustain: 0.55, release: 0.06 },
      filter: { type: 'lowpass', cutoff: '$cutoff', q: '$resonance', envAmount: '$envmod', envelope: { attack: 0.002, decay: '$decay', sustain: 0, release: 0.08 } } } },

    params: [
      { id: 'tone', label: 'Tone', min: 80, max: 2000, default: 600, curve: 'log', unit: 'Hz' },
      { id: 'grit', label: 'Grit', min: 0, max: 0.6, default: 0.14 },
      { id: 'release', label: 'Release', min: 0.02, max: 1, default: 0.12, unit: 's' }],
    voice: { gain: 0.55, oscillators: [{ wave: 'sine', gain: 1 }, { wave: 'triangle', gain: '$grit' }],
      envelope: { attack: 0.004, decay: 0.2, sustain: 0.95, release: '$release' }, filter: { type: 'lowpass', cutoff: '$tone', q: 0.5 } } },
  { id: 'th.square-lead', type: 'instrument', name: 'Square Lead', author: 'Tapehouse', description: 'Bright chip-style lead with vibrato.',
    params: [

      { id: 'vibrato', label: 'Vibrato', min: 0, max: 40, default: 10, unit: 'ct' },
      { id: 'release', label: 'Release', min: 0.02, max: 1.5, default: 0.25, unit: 's' }],
    voice: { gain: 0.2, oscillators: [{ wave: 'square', gain: 0.6 }, { wave: 'square', detune: 7, gain: 0.4 }, { wave: 'sawtooth', octave: 1, gain: 0.12 }],
      envelope: { attack: 0.01, decay: 0.25, sustain: 0.7, release: '$release' },

function pickFiles(accept) { const fi = $('#fileInput'); fi.accept = accept || ''; fi.value = ''; fi.click(); }
const GM_DRUMS = { 35: 'kick', 36: 'kick', 37: 'perc', 38: 'snare', 39: 'clap', 40: 'snare', 41: 'tom', 42: 'hat', 43: 'tom', 44: 'hat', 45: 'tom', 46: 'openhat', 47: 'tom', 48: 'tom', 49: 'openhat', 50: 'tom', 51: 'openhat', 54: 'shaker', 56: 'perc', 57: 'openhat', 60: 'perc', 61: 'perc', 62: 'perc', 63: 'perc', 64: 'perc', 69: 'shaker', 70: 'shaker', 75: 'perc', 76: 'perc', 77: 'perc' };
function computePeaks(buf, n) {
  const d0 = buf.getChannelData(0), d1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null, L = d0.length, step = Math.max(1, Math.floor(L / n));
  const out = []; let mx = 0;
  for (let i = 0; i < n; i++) {
    let p = 0; const a = i * step, b = Math.min(L, a + step);
    for (let j = a; j < b; j += 4) { const v = Math.abs(d0[j]) + (d1 ? Math.abs(d1[j]) : 0); if (v > p) p = v; }
    out.push(p); if (p > mx) mx = p;
  }
  return out.map(p => mx ? Math.round(p / mx * 1000) / 1000 : 0);
}
async function importAudioBytes(name, bytes, o = {}) {

  if (!ab.byteLength) throw new Error(`${fileName(name)} is empty.`);
  let buf;
  try { buf = await decodeAB(decodeCtx(), ab.slice(0)); } catch (e) { throw new Error(`${fileName(name)}: this browser can’t decode that audio format.`); }
  const id = o.id || uid();
  const meta = { id, name: baseName(name).slice(0, 80), ext: extOf(name) || 'wav', folder: String(o.folder || 'Imported').slice(0, 60), size: ab.byteLength,
    duration: buf.duration, channels: buf.numberOfChannels, peaks: computePeaks(buf, 120), addedAt: Date.now() };
  await Store.put('sampleData', { id, data: ab });
  await Store.put('samples', meta);
  lib.set(id, meta); buffers.set(id, buf);
  return meta;
}
async function importMidi(name, ab) {
  const mid = parseMidi(ab), tps = mid.div / 4;

    if (!tr.notes.length) continue;
    const byCh = new Map(); for (const n of tr.notes) { if (!byCh.has(n.ch)) byCh.set(n.ch, []); byCh.get(n.ch).push(n); }
    for (const [c, notes] of byCh) groups.push({ name: tr.name, ch: c, notes });
  }
  if (!groups.length) throw new Error(`${fileName(name)} has no notes in it.`);
  groups = groups.slice(0, 16);
  let maxEnd = 0; for (const g of groups) for (const n of g.notes) maxEnd = Math.max(maxEnd, Math.round(n.t1 / tps));
  const length = clamp(Math.ceil(maxEnd / 16) * 16, 16, 512);
  let made = 0;
  mutate(P => {
    const pat = newPattern(P.patterns.length, length); pat.name = baseName(name).slice(0, 40);
    P.patterns.push(pat); P.currentPattern = pat.id; ui.plBrush = pat.id;
    groups.forEach((g, gi) => {
      if (g.ch === 9) {
        const byKind = new Map();
        for (const n of g.notes) { const s = Math.round(n.t0 / tps); if (s >= length) continue; const k = GM_DRUMS[n.n] || 'perc'; if (!byKind.has(k)) byKind.set(k, []); byKind.get(k).push({ s, v: clamp(n.v, 0.2, 1) }); }
        for (const [k, hits] of byKind) {
          makeChannel(P, { name: DRUMS.find(d => d[0] === k)[1], kind: 'drum', drum: k }); const ch = P.channels[P.channels.length - 1]; made++;
          const arr = ensureSteps(pat, ch.id); for (const h of hits) arr[h.s] = Math.max(arr[h.s] || 0, Math.round(h.v * 100) / 100);
        }
      } else {
        const avg = g.notes.reduce((a, n) => a + n.n, 0) / g.notes.length;
        const ch = makeChannel(P, { name: (g.name || `MIDI ${gi + 1}`).slice(0, 32), kind: 'synth', plugin: avg < 48 ? 'th.sub-bass' : 'th.tape-keys' }); made++;
        pat.notes[ch.id] = g.notes.map(n => ({ s: Math.round(n.t0 / tps), l: Math.max(1, Math.round((n.t1 - n.t0) / tps)), n: clamp(n.n, PR.lo, PR.hi), v: Math.round(clamp(n.v, 0.1, 1) * 100) / 100 }))
          .filter(n => n.s < length).map(n => ({ ...n, l: Math.min(n.l, length - n.s) }));
      }
    });

  else toast(`“${baseName(name)}” is now a pattern with ${made} channel${made === 1 ? '' : 's'}.${extra}`, { action: { label: 'Open Notes', run: () => setTab('piano') } });
}
async function importBundle(entries, manifestEntry, res) {
  const j = JSON.parse(new TextDecoder().decode(await manifestEntry.get()));
  if (!j || j.format !== 'tapehouse-bundle' || !j.project) throw new Error('This project bundle is damaged.');
  for (const pl of j.plugins || []) {
    if (plugins.has(pl.id)) continue;
    const en = entries.find(e => e.name === pl.file); if (!en) continue;
    try { await installPluginText(new TextDecoder().decode(await en.get()), pl.id); res.plugins++; } catch (e) { res.errors.push(e.message); }
  }
  for (const s of j.samples || []) {
    if (lib.has(s.id)) continue;
    const en = entries.find(e => e.name === s.file); if (!en) { res.errors.push(`The bundle is missing ${s.file}`); continue; }
    try { res.audio.push(await importAudioBytes(`${s.name}.${s.ext}`, await en.get(), { folder: s.folder, id: s.id })); } catch (e) { res.errors.push(e.message); }
  }

}
async function importZip(name, ab, res, progress) {
  const entries = readZip(ab);
  const pm = entries.find(e => fileName(e.name) === 'tapehouse-project.json');
  if (pm) return importBundle(entries, pm, res);
  let libMap = null;
  const lm = entries.find(e => fileName(e.name) === 'tapehouse-library.json');
  if (lm) { try { const j = JSON.parse(new TextDecoder().decode(await lm.get())); libMap = new Map((j.samples || []).map(s => [s.file, s])); } catch (e) { /* treat as a plain zip */ } }
  const zipFolder = baseName(name);
  let i = 0;
  for (const en of entries) {
    const ext = extOf(en.name);
    try {
      if (AUDIO_EXT.includes(ext)) {
        const meta = libMap && libMap.get(en.name);
        if (meta && lib.has(meta.id)) { res.skipped++; continue; }
        const parts = en.name.split('/'), sub = parts.length >= 2 ? parts[parts.length - 2] : '';
        const folder = meta ? meta.folder : (sub && sub !== zipFolder ? `${zipFolder} / ${sub}` : zipFolder);
        res.audio.push(await importAudioBytes(meta ? `${meta.name}.${ext}` : fileName(en.name), await en.get(), { folder, id: meta && meta.id }));
      } else if (ext === 'mid' || ext === 'midi') {
        const u8 = await en.get(); await importMidi(fileName(en.name), u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength)); res.midi++;
      } else if (ext === 'js' || ext === 'json') {
        const txt = new TextDecoder().decode(await en.get());
        if (ext === 'js' || /"format"\s*:\s*"tapehouse-plugin"/.test(txt)) { await installPluginText(txt); res.plugins++; }
      }
    } catch (e) { res.errors.push(e.message.includes(fileName(en.name)) ? e.message : `${fileName(en.name)}: ${e.message}`); }
    if (progress) progress(++i, entries.length);
  }
}
async function importFiles(files) {
  const res = { audio: [], midi: 0, plugins: 0, projects: 0, skipped: 0, errors: [] };
  if (!files.length) return res;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const folder = ui.importFolder || 'Imported';
  const busy = toast(`Importing ${files.length} file${files.length > 1 ? 's' : ''}…`, { sticky: true, kind: 'busy' });
  let k = 0;
  for (const f of files) {
    k++; const ext = extOf(f.name);
    try {
      if (AUDIO_EXT.includes(ext) || (f.type || '').startsWith('audio/')) { busy.set(`Importing ${k} of ${files.length}: ${f.name}`); res.audio.push(await importAudioBytes(f.name, await f.arrayBuffer(), { folder })); }
      else if (ext === 'mid' || ext === 'midi') { await importMidi(f.name, await f.arrayBuffer()); res.midi++; }
      else if (ext === 'zip') { await importZip(f.name, await f.arrayBuffer(), res, (i, n) => busy.set(`Unpacking ${f.name}: ${i} of ${n}`)); }
      else if (ext === 'json') {
        const txt = await f.text(); let obj;
        try { obj = JSON.parse(txt); } catch (e) { throw new Error(`${f.name} isn’t valid JSON.`); }
        if (obj && obj.format === 'tapehouse-plugin') { await installPluginText(txt); res.plugins++; }
        else if (obj && obj.format === 'tapehouse-project') { await openProjectObject(obj); res.projects++; }
        else throw new Error(`${f.name} isn’t a Tapehouse plugin or project.`);
      } else if (ext === 'js' || ext === 'txt') { await installPluginText(await f.text()); res.plugins++; }
      else res.errors.push(`${f.name}: this file type isn’t supported.`);
    } catch (e) { res.errors.push(e.message || String(e)); }
  }
  busy.done();
  const bits = [];
  if (res.audio.length) bits.push(`${res.audio.length} sound${res.audio.length > 1 ? 's' : ''}`);
  if (res.plugins) bits.push(`${res.plugins} plugin${res.plugins > 1 ? 's' : ''}`);
  if (res.projects) bits.push('a project');
  if (res.skipped) bits.push(`${res.skipped} already in your library`);
  if (bits.length) toast(`Imported ${bits.join(', ')}.`, res.audio.length && ui.tab !== 'library' && !isWide() ? { action: { label: 'Open library', run: () => setTab('library') } } : {});
  if (res.errors.length) toast(res.errors[0] + (res.errors.length > 1 ? ` (and ${res.errors.length - 1} more)` : ''), { kind: 'error', ms: 8000 });
  if (res.audio.length) { ui.libFolder = 'All'; }
  renderLib(); render();
  return res;
}

async function exportAudio(what, out) {

  try {
    const { buffer, frames } = await renderOffline(project, what);
    let peak = 0; for (let c = 0; c < buffer.numberOfChannels; c++) { const d = buffer.getChannelData(c); for (let i = 0; i < frames; i += 2) { const a = Math.abs(d[i]); if (a > peak) peak = a; } }
    const wav = encodeWav(buffer, frames), name = safeFile(project.name + (what === 'pattern' ? ' - ' + curPattern().name : ''));
    const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
    out.replaceChildren(el('span', {}, `${fmtDur(frames / buffer.sampleRate)} rendered, ${fmtBytes(wav.byteLength)} as 16-bit WAV.`),
      peak > 1 ? el('span', { class: 'fx-err' }, `The mix clips (peak ${fmtDb(peak)} dB). Pull the master fader down a little.`) : null,
      el('audio', { controls: true, src: url }));
    if (downloads && downloads.native) { if (await saveFile(name + '.wav', new Uint8Array(wav))) out.append(el('span', { class: 'muted small' }, 'Saved to your Downloads folder.')); }
    else if (downloads) { if (await saveFile(name + '.zip', makeZip([{ name: name + '.wav', data: new Uint8Array(wav) }]))) out.append(el('span', { class: 'muted small' }, 'Saved as a .zip with the .wav inside.')); }

}

  const E = new Engine(oac, () => P, { offline: true }); E.build();
  const add = o => { const ch = { id: uid(), name: 'x', params: {}, vol: 0.9, pan: 0, mute: false, insert: 0, ...o }; P.channels.push(ch); E.sync(); return ch; };

}
async function storeRendered(id, name, folder, buf) {

  addFxTo(P, padCh, [['th.chorus', { mix: 0.35 }], ['th.room-reverb', { size: 4.5, mix: 0.4 }]]);
  addFxTo(P, leadCh, [['th.tape-delay', { time: 0.75, mix: 0.2 }], ['th.room-reverb', { size: 2.8, mix: 0.25 }]]);
  if (S.lofi) { addFxTo(P, chordCh, [['th.bitcrusher', { bits: 9, mix: 0.25 }]]); P.mixer[0].fx.unshift(fxSlot('th.saturator', { drive: 0.3, tone: 6000, mix: 0.6, output: -2 })); }
  P.currentPattern = full.id;
  P.song = { title: plan.title, prompt: plan.prompt || '', tags: plan.tags || [], style: plan.style, vocal: false, prog: plan.prog, seed: hashStr(plan.title + ':' + variant + ':' + Date.now()), created: Date.now(),
    roles: { kick: chs.kick ? chs.kick.id : '', bass: bassCh.id, chords: chordCh.id, pad: padCh.id, lead: leadCh.id }, tracks: TR };
  return P;
}

/* ---------- create flow ---------- */
let createCtl = null;
function readComposer() {
  return { desc: (ui.cDesc || '').trim(), tags: ui.cTags.slice(), opts: { lyrics: ui.cCustom ? (ui.cLyrics || '').trim() : '', title: ui.cCustom ? (ui.cTitle || '').trim() : '' } };
}
async function createSong(fromPlan) {
  if (ui.cBusy) return;
  const { desc, tags, opts } = readComposer();
  if (!fromPlan && !desc && !tags.length && !opts.lyrics) { ui.cStatus = { kind: 'err', text: 'Describe your song or tap a style first.' }; refreshCreate(); return; }
  ui.cBusy = true; ui.cStatus = { kind: '', text: sampleFn && !fromPlan ? 'Claude is writing the title, lyrics and structure. This can take up to a minute.' : 'Building two takes…' }; refreshCreate();
  let plans;
  try {
    if (fromPlan) plans = [fromPlan, { ...fromPlan }];
    else {
      const a = planLocal(desc, tags, opts, 0), b = planLocal(desc, tags, opts, 1);
      if (sampleFn) {
        createCtl = new AbortController();
        try {
          const d = await sampleFn.json(planPrompt(desc, tags, opts), { signal: createCtl.signal, modelTier: 'default' });
          const p = planFromClaude(d, a); plans = [p, { ...p, prog: { ...p.prog, verse: p.prog.verse, chorus: p.prog.chorus } }];
        } catch (e) {
          if (e && e.code === 'cancelled') { ui.cBusy = false; ui.cStatus = { kind: '', text: 'Stopped.' }; refreshCreate(); return; }
          plans = [a, b]; toast(`Claude couldn’t write this one (${(e && SAMPLE_ERR[e.code]) || 'try again later'}), so the built-in songwriter made it.`, { kind: 'error', ms: 7000 });
        } finally { createCtl = null; }
      } else plans = [a, b];
    }
    await wait(30);
    ui.takes = plans.map((p, i) => ({ id: uid(), plan: p, project: buildSong(p, i), kept: false }));
    ui.cStatus = { kind: 'ok', text: 'Two takes are ready. Play them and keep the one you like.' };
  } catch (e) { ui.cStatus = { kind: 'err', text: `Something went wrong: ${e.message}` }; }
  ui.cBusy = false; refreshCreate();
}
async function keepTake(t) {
  stopSongPreview();
  await openProjectObject(t.project);
  t.kept = true; t.project = JSON.parse(JSON.stringify(project));
  T.mode = 'song'; T.songPos = T.marker = 0; renderTransport();
  loadSongs(); refreshCreate();
  toast(`“${project.name}” is open. Press play, or dig into Beat, Notes and Song.`, { action: { label: 'Play', run: () => { setMode('song'); if (!T.playing) play(); } } });
}
function planFromProject(P) {
  const s = P.song || {};
  return { title: P.name, prompt: s.prompt || '', tags: s.tags || [], style: s.style || 'pop', bpm: P.bpm, key: P.key, scale: P.scale, vocal: false,
    prog: s.prog || { verse: [0, 5, 2, 6], chorus: [3, 4, 0, 5], bridge: [5, 3, 0, 4] },
    sections: (P.playlist.markers || []).map((m, i, a) => ({ name: m.name, bars: Math.max(4, Math.round(((a[i + 1] ? a[i + 1].start : songLength(P)) - m.start) / 16 / 4) * 4), lyrics: m.lyrics || '' })) };
}
function extendSong() {
  const P0 = project;
  if (!P0.song || !P0.song.roles) { toast('Extend works on songs made in Create.'); return; }
  const marks = [...P0.playlist.markers].sort((a, b) => a.start - b.start);
  const ci = marks.map(m => sectionInfo(m.name).type === 'chorus').lastIndexOf(true);
  if (ci < 0) { toast('This song has no chorus to build on yet.'); return; }
  mutate(P => {
    const s = P.song, R = s.roles, TR = s.tracks || { drums: 0, bass: 1, chords: 2, lead: 3 }, prog = (s.prog && s.prog.bridge) || [5, 3, 0, 4];
    const ch = id => P.channels.find(c => c.id === id);
    const mk = (role, name, fill) => { let p = P.patterns.find(x => x.role === role); if (!p) { p = { ...newPattern(P.patterns.length, 64), name, role, color: COLORS[3] }; fill(p); P.patterns.push(p); } return p; };
    const parts = [];
    if (ch(R.chords)) parts.push([TR.chords, mk('chords:bridge', 'Bridge Chords', p => { p.notes[R.chords] = genChordNotes(P, prog, 'sustain'); if (ch(R.pad)) p.notes[R.pad] = genChordNotes(P, prog, 'sustain'); })]);
    if (ch(R.bass)) parts.push([TR.bass, mk('bass:bridge', 'Bridge Bass', p => { const b = ch(R.bass); let ns = genBass(P, prog, 'simple', null); if (b.kind === 'drum') ns = ns.map(n => ({ ...n, n: to808(n.n) })); p.notes[R.bass] = ns; })]);
    if (ch(R.lead)) parts.push([TR.lead, mk('melody:bridge', 'Bridge Melody', p => { p.notes[R.lead] = genMelody(P, prog, 2); })]);
    const light = P.patterns.find(x => x.role === 'drums:light');
    if (light) parts.push([TR.drums, light]);
    const ms = [...P.playlist.markers].sort((a, b) => a.start - b.start), chorus = ms[ci], cEnd = ms[ci + 1] ? ms[ci + 1].start : songLength(P);
    const chorusClips = P.playlist.clips.filter(c => c.start >= chorus.start && c.start < cEnd);
    const outro = ms.slice(ci + 1).find(m => sectionInfo(m.name).type === 'outro');
    const at = outro ? outro.start : songLength(P), bridgeLen = 128, add = bridgeLen + (cEnd - chorus.start);
    for (const c of P.playlist.clips) if (c.start >= at) c.start += add;
    for (const m of P.playlist.markers) if (m.start >= at) m.start += add;
    for (const [track, p] of parts) P.playlist.clips.push({ id: uid(), kind: 'pattern', ref: p.id, track, start: at, len: bridgeLen, gain: 1, offset: 0 });
    for (const c of chorusClips) P.playlist.clips.push({ ...c, id: uid(), start: at + bridgeLen + (c.start - chorus.start) });
    P.playlist.markers.push({ id: uid(), start: at, name: 'Bridge', lyrics: '' }, { id: uid(), start: at + bridgeLen, name: 'Final Chorus', lyrics: chorus.lyrics || '' });
    P.playlist.markers.sort((a, b) => a.start - b.start);
  });
  toast(`Added a bridge and a final chorus. The song is now ${songLength(project) / 16} bars.`, { action: { label: 'Play', run: () => { setMode('song'); if (!T.playing) play(); } } });
}

/* ---------- previews (rendered excerpts) ---------- */
let songPrev = null;
function stopSongPreview() {
  if (songPrev) { try { songPrev.src.stop(); } catch (e) { /* ok */ } songPrev = null; }
  if (ui.pvKey) { ui.pvKey = null; ui.pvLoading = false; refreshCreate(); }
}
async function previewProject(P, key) {
  if (!ensureCtx()) return;
  const same = ui.pvKey === key; stopSongPreview(); if (same) return;
  if (T.playing) halt();
  ui.pvKey = key; ui.pvLoading = true; refreshCreate();
  try {
    const ch = (P.playlist.markers || []).find(m => sectionInfo(m.name).type === 'chorus');
    const from = ch ? ch.start : 0, to = Math.min(songLength(P), from + 12 * 16);
    const { buffer, frames } = await renderOffline(P, 'song', 44100, { from, to });
    if (ui.pvKey !== key) return;
    const src = ctx.createBufferSource(), g = ctx.createGain(), now = ctx.currentTime, dur = frames / buffer.sampleRate;
    src.buffer = buffer; g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.95, now + 0.04);
    g.gain.setValueAtTime(0.95, now + Math.max(0.1, dur - 1.5)); g.gain.linearRampToValueAtTime(0, now + dur);
    src.connect(g); g.connect(ctx.destination); src.start(now, 0, dur);
    songPrev = { src, key }; ui.pvLoading = false; refreshCreate();
    src.onended = () => { if (songPrev && songPrev.src === src) { songPrev = null; ui.pvKey = null; refreshCreate(); } };
  } catch (e) { ui.pvKey = null; ui.pvLoading = false; refreshCreate(); toast(`Preview failed: ${e.message}`, { kind: 'error' }); }
}

/* ---------- your songs ---------- */
async function loadSongs() {
  try {
    const list = await Store.all('projects');
    ui.songs = list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 40).map(r => { try { return { id: r.id, P: normalizeProject(JSON.parse(r.data)), updatedAt: r.updatedAt }; } catch (e) { return null; } }).filter(Boolean);
  } catch (e) { ui.songs = []; }
  refreshCreate();
}
function refreshCreate() { if (ui.tab === 'create') renderView(); }
function highlightLyrics(step) {
  const secs = $$('.ly-sec', $('#view')); if (!secs.length) return;
  const ms = [...(project.playlist.markers || [])].sort((a, b) => a.start - b.start);
  let cur = -1; if (step >= 0 && T.mode === 'song') ms.forEach((m, i) => { if (m.start <= step) cur = i; });
  secs.forEach((s, i) => s.classList.toggle('now', i === cur));
}

/* ---------- Create view ---------- */
function pvButton(P, key, label) {
  const on = ui.pvKey === key;
  return el('button', { class: 'pv-btn' + (on ? ' on' : ''), 'aria-label': (on ? 'Stop ' : 'Preview ') + label, title: on ? 'Stop preview' : 'Hear the chorus', onclick: e => { e.stopPropagation(); previewProject(P, key); } },
    on && ui.pvLoading ? el('span', { class: 'spin' }) : icon(on ? 'stop' : 'play'));
}
function takeCard(t, i) {
  const P = t.project, pl = t.plan, len = songLength(P) * 15 / P.bpm, key = 'take:' + t.id;
  return el('article', { class: 'c-take' + (t.kept ? ' kept' : '') },
    el('div', { class: 'c-take-top' }, pvButton(P, key, pl.title),
      el('div', { class: 'c-take-body' }, el('span', { class: 'c-k' }, t.kept ? `Take ${i + 1} · kept` : `Take ${i + 1}`), el('h3', {}, pl.title))),
    el('div', { class: 'c-meta' }, `${STYLES[pl.style].label} · ${pl.bpm} BPM · ${KEY_NAMES[pl.key]} ${SCALES[pl.scale].label} · ${fmtDur(len)}`),
    el('div', { class: 'c-tagline sec-line' }, pl.sections.map(s => el('span', {}, s.name))),
    el('div', { class: 'btn-row' }, el('button', { class: 'btn primary sm', onclick: () => keepTake(t) }, t.kept ? 'Open again' : 'Keep and open')));
}
function nowOpenCard() {
  const P = project, s = P.song, len = songLength(P) * 15 / P.bpm, ms = [...(P.playlist.markers || [])].sort((a, b) => a.start - b.start);
  const hasWords = ms.some(m => m.lyrics);
  return el('section', { class: 'c-card c-now' },
    el('div', { class: 'c-take-body' },
      el('span', { class: 'c-k' }, 'Open in the studio'),
      el('h3', {}, P.name),
      el('div', { class: 'c-meta' }, `${P.bpm} BPM · ${keyLabel(P)} · ${P.playlist.clips.length ? fmtDur(len) : 'no arrangement yet'}`),
      el('div', { class: 'btn-row', style: { marginTop: '6px' } },
        el('button', { class: 'btn primary sm', onclick: () => { setMode('song'); if (!T.playing) play(); else togglePlay(); } }, T.playing ? 'Pause' : 'Play song'),
        s ? el('button', { class: 'btn sm', onclick: extendSong, title: 'Add a bridge and a final chorus' }, 'Extend') : null,
        s ? el('button', { class: 'btn sm', onclick: () => createSong(planFromProject(P)), title: 'Two new takes with the same structure' }, 'New takes of this') : null,
        el('button', { class: 'btn sm ghost', onclick: () => setTab('playlist') }, 'Open in Song'),
        el('button', { class: 'btn sm ghost', onclick: () => setTab('vocal') }, 'Record a vocal'))),
    ms.length && !hasWords ? el('div', { class: 'ly' },
      el('h3', { class: 'c-sub' }, 'Sections'),
      el('div', { class: 'c-tagline sec-line' }, ms.map((m, i) => el('span', { class: 'ly-sec', 'data-i': String(i) }, m.name))))
    : ms.length ? el('div', { class: 'ly' },
      el('h3', { class: 'c-sub' }, 'Lyrics'),
      ms.map((m, i) => el('div', { class: 'ly-sec', 'data-i': String(i) },
        el('h4', {}, m.name, el('button', { class: 'ly-edit', onclick: () => { ui.plMark = m.id; ui.plSel = null; setTab('playlist'); } }, m.lyrics ? 'Edit' : 'Add words')),
        m.lyrics ? el('p', {}, m.lyrics) : null))) : null);
}
function songsGrid() {
  const list = (ui.songs || []).filter(x => x.id !== project.id);
  if (!list.length) return null;
  return el('section', { class: 'c-sec' }, el('h3', { class: 'c-sub' }, 'Your songs'),
    el('div', { class: 'c-songs' }, list.map(x => {
      const P = x.P, key = 'song:' + x.id;
      return el('article', { class: 'c-song' },
        P.playlist.clips.length ? pvButton(P, key, P.name) : el('span', { class: 'pv-btn idle', 'aria-hidden': 'true' }, icon('play')),
        el('div', { class: 'c-take-body' }, el('b', {}, P.name),
          el('span', { class: 'c-meta' }, `${P.bpm} BPM · ${keyLabel(P)} · ${new Date(x.updatedAt || 0).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`)),
        el('button', { class: 'btn sm', onclick: () => { stopSongPreview(); loadProject(x.id).then(loadSongs); } }, 'Open'));
    })));
}
function renderCreate(v) {
  if (!ui.songs) loadSongs();
  const tags = el('div', { class: 'chips c-tags' }, CREATE_TAGS.map(label => el('button', { class: 'chip', 'aria-pressed': String(ui.cTags.includes(label)), onclick: e => {
    const i = ui.cTags.indexOf(label); if (i >= 0) ui.cTags.splice(i, 1); else ui.cTags.push(label);
    e.currentTarget.setAttribute('aria-pressed', String(i < 0));
  } }, label)));
  const status = ui.cStatus ? el('div', { class: 'sdk-status ' + (ui.cStatus.kind || ''), 'aria-live': 'polite' }, ui.cStatus.text) : null;
  const composer = el('section', { class: 'c-card c-composer' },
    el('h2', { class: 'c-h' }, 'What do you want to make?'),
    el('textarea', { class: 'c-desc', rows: '3', 'aria-label': 'Describe your song', placeholder: 'Describe it: “a dreamy late-night pop song about driving home with the windows down”', value: ui.cDesc || '', oninput: e => { ui.cDesc = e.target.value; } }),
    tags,
    el('div', { class: 'btn-row' },
      el('label', { class: 'c-toggle' }, el('input', { type: 'checkbox', checked: !!ui.cCustom, onchange: e => { ui.cCustom = e.target.checked; renderView(); } }), 'My own title and lyrics')),
    ui.cCustom ? el('div', { class: 'c-custom' },
      el('input', { type: 'text', 'aria-label': 'Song title', placeholder: 'Title', value: ui.cTitle || '', oninput: e => { ui.cTitle = e.target.value; } }),
      el('textarea', { rows: '7', 'aria-label': 'Your lyrics', placeholder: '[Verse]\nYour words here\n\n[Chorus]\nThe part everyone sings', value: ui.cLyrics || '', oninput: e => { ui.cLyrics = e.target.value; } })) : null,
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn primary big', disabled: !!ui.cBusy, onclick: () => createSong() }, ui.cBusy ? 'Creating…' : 'Create'),
      ui.cBusy && createCtl ? el('button', { class: 'btn', onclick: () => createCtl && createCtl.abort() }, 'Stop') : null,
      el('span', { class: 'hint c-who' }, sampleFn ? 'Claude plans the title, structure and chords, and Tapehouse builds the music.' : 'Tapehouse builds the whole song from your description and tags.')),
    status);
  const body = el('div', { class: 'view-body create', 'data-scroll': 'create' }, composer);
  if (ui.takes && ui.takes.length) body.append(el('section', { class: 'c-sec' }, el('h3', { class: 'c-sub' }, 'New takes'), el('div', { class: 'c-takes' }, ui.takes.map(takeCard))));
  body.append(nowOpenCard());
  const grid = songsGrid(); if (grid) body.append(grid);
  v.append(tipStrip('create') || '', body);
  if (T.playing && T.shown >= 0) highlightLyrics(T.shown);
}

/* ---------- stems ---------- */
async function exportStems() {
  const P = project, used = usedChannels(P);
  if (!used.length) { toast('There’s nothing to export yet.'); return; }
  const busy = toast('Rendering stems…', { sticky: true, kind: 'busy' }), files = [];
  try {
    for (let i = 0; i < used.length; i++) {
      busy.set(`Rendering stem ${i + 1} of ${used.length}: ${used[i].name}`);
      const Q = JSON.parse(JSON.stringify(P)); Q.channels.forEach(c => { c.mute = c.id !== used[i].id; });
      Q.playlist.clips = Q.playlist.clips.filter(c => c.kind !== 'audio');
      const { buffer, frames } = await renderOffline(Q, P.playlist.clips.length ? 'song' : 'pattern', 44100, null, { noMaster: true });
      files.push({ name: `${String(i + 1).padStart(2, '0')} ${safeFile(used[i].name)}.wav`, data: new Uint8Array(encodeWav(buffer, frames)) });
    }
    if (P.playlist.clips.some(c => c.kind === 'audio')) {
      busy.set('Rendering the audio clips stem');
      const Q = JSON.parse(JSON.stringify(P)); Q.channels.forEach(c => { c.mute = true; });
      const { buffer, frames } = await renderOffline(Q, 'song', 44100, null, { noMaster: true });
      files.push({ name: `${String(files.length + 1).padStart(2, '0')} Audio clips.wav`, data: new Uint8Array(encodeWav(buffer, frames)) });
    }
    busy.done();
    await saveFile(`${safeFile(P.name)} stems.zip`, makeZip(files));
  } catch (e) { busy.done(); toast(`Couldn’t render stems: ${e.message}`, { kind: 'error' }); }
}

boot();
