name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check-shell:
    name: validate desktop wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  smoke:
    name: launch the packaged app
    runs-on: windows-latest
    needs: check-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - run: node tools/smoke-win.mjs
      - name: say what broke
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path smoke-failure.txt) {
            $report = (Get-Content smoke-failure.txt) -join ' | '
            echo "::error title=smoke::$($report -replace '%','%25')"
          }
      - name: keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-failure.txt
          if-no-files-found: ignore

  installer:
    name: build NSIS installer
    runs-on: windows-latest
    needs: check-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the installer
        shell: pwsh
        run: |
          npm run installer 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: say what broke
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content installer.log -Tail 30 -ErrorAction SilentlyContinue) -join ' | '
          if ($tail) { echo "::error title=installer::$($tail -replace '%','%25')" }
      - uses: actions/upload-artifact@v4
        with:
          name: Tapehouse-Setup
          path: release/Tapehouse-Setup-*.exe
          if-no-files-found: error
