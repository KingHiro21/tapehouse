name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check-shell:
    name: validate desktop wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  smoke:
    name: launch the packaged app
    runs-on: windows-latest
    needs: check-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - run: node tools/smoke-win.mjs
      - name: say what broke
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path smoke-failure.txt) {
            $report = (Get-Content smoke-failure.txt) -join ' | '
            echo "::error title=smoke::$($report -replace '%','%25')"
          }
      - name: keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            smoke-failure.png
            smoke-failure.txt
          if-no-files-found: ignore

  release:
    name: build and publish the release
    runs-on: windows-latest
    needs: [check-shell, smoke]
    # The checks and the smoke test run on every push; a 121 MB installer per push
    # is not worth keeping, so this job waits for a tag or a manual run. A tag also
    # publishes a GitHub Release, which is what the in-app updater checks.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: package the portable app
        shell: pwsh
        run: |
          npm run pack:win 2>&1 | Tee-Object -FilePath pack.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path 'out/Tapehouse-win32-x64/*' -DestinationPath "Tapehouse-Portable-$v.zip"
          echo "PORTABLE=Tapehouse-Portable-$v.zip" >> $env:GITHUB_ENV
      - name: build the installer
        shell: pwsh
        run: |
          npm run installer 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: say what broke
        if: failure()
        shell: pwsh
        run: |
          $tail = (Get-Content pack.log, installer.log -Tail 30 -ErrorAction SilentlyContinue) -join ' | '
          if ($tail) { echo "::error title=release::$($tail -replace '%','%25')" }
      - name: publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Tapehouse-Setup-*.exe
            ${{ env.PORTABLE }}
          make_latest: true
      - name: keep the builds for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Tapehouse-Setup
          path: |
            release/Tapehouse-Setup-*.exe
            ${{ env.PORTABLE }}
          if-no-files-found: error
